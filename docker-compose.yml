services:
  strava-to-llm:
    image: romanew/all:strava-to-llm
    container_name: strava-to-llm
    restart: unless-stopped
    ports:
      - "11004:8000"
    environment:
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
      # COROS MCP endpoint; set to your region (EU: https://mcpeu.coros.com/mcp).
      COROS_MCP_URL: ${COROS_MCP_URL:-https://mcp.coros.com/mcp}
    volumes:
      - ./data:/app/data     # per-user secrets/tokens/reports + shared cache
