name: CI

on: [push]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to Registry
        uses: elgohr/Publish-Docker-Github-Action@master
        with:
          name: romanew/all:strava-to-llm
          username: ${{ secrets.DOCKER_PUBLISH_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_PUBLISH_REGISTRY_PASSWORD }}

  deploy-mne:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@master
        with:
          host: 31.186.136.15
          username: root
          port: 11022
          key: ${{ secrets.SSH_PRIVATE_KEY_PERSONAL }}
          source: docker-compose.yml
          target: ~/strava-to-llm/

      - name: Start using docker-compose
        uses: appleboy/ssh-action@master
        with:
          host: 31.186.136.15
          username: root
          port: 11022
          key: ${{ secrets.SSH_PRIVATE_KEY_PERSONAL }}
          script: |
            cd strava-to-llm
            export STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID }}
            export STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }}
            docker compose down
            docker compose pull
            docker compose up -d
